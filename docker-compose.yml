# The services the app needs on a developer's computer. Start them with: docker compose up -d
name: procurement

services:
  postgres:
    # PostgreSQL 17, the newest 17.x on each `docker compose pull` (13-technology.md, Database).
    image: postgres:17
    # The cluster name tells this server apart from any other PostgreSQL on the same machine.
    # A database test reads it back, so the tests can only pass against this service.
    command: ["postgres", "-c", "cluster_name=procurement-compose"]
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement
      # No password, on purpose. It is safe here and nowhere else: the port below answers on
      # 127.0.0.1 only, and the data is invented. The real database on DigitalOcean always has
      # a password, and it lives in the provider dashboard, never in this repository.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # This machine only. Never publish it wider: with no password, anyone who can reach the
      # port can read and change everything. 5433 on the outside, because 5432 is often taken
      # by another PostgreSQL on a developer's computer.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=procurement --dbname=procurement"]
      interval: 5s
      timeout: 3s
      retries: 12

  storage:
    # The file storage of this machine: SeaweedFS speaking the S3 API, as Cloudflare R2 does in
    # the cloud (13-technology.md, Files). It replaces MinIO, whose images are gone (D18; plan of
    # 0.12, decision 1, Look first). Pinned: a new version is a decision, not a pull.
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-ip.bind=0.0.0.0"]
    environment:
      # Invented keys, public on purpose, like the passwordless PostgreSQL above: the port below
      # answers on 127.0.0.1 only and the files are invented (plan of 0.12, decision 14). They
      # open nothing anywhere else; R2's keys live in the provider dashboard only.
      AWS_ACCESS_KEY_ID: procurement-local
      AWS_SECRET_ACCESS_KEY: procurement-local-secret
    ports:
      # This machine only, as PostgreSQL's port.
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  postgres-data:
  storage-data:
