name: CI

# The gate of every pull request (build-plan 0.3; docs/decisions.md, "Decided ahead: task 0.3").
# Two jobs, named exactly `checks` and `e2e`: the review routine reads these names and the
# owner makes them required (docs/cloud-loop.md, section 7). They are never renamed.
#
# PostgreSQL is the service of docker-compose.yml, as on the laptop and in a cloud session.
# The workflow holds no secret: DATABASE_URL is the public local address of README.md, with no
# password, which answers on the runner's 127.0.0.1 only.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request stops the older run. On main every commit keeps its own run:
# GitHub keeps one waiting run per group, so a shared group could drop a merge's run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgres://procurement@127.0.0.1:5433/procurement

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history: the migration check below compares with the base. No step needs the
      # token after checkout, so it is not left in .git/config for the code under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit the production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Lint
        run: npm run lint

      # 15-quality-and-acceptance.md, Done-check: no translation key is missing (task 0.5).
      - name: Every translation key is in all three languages
        run: npm run i18n:check

      - name: Typecheck
        run: npm run typecheck

      # Before the tests, so the database is really empty. The first run must apply every
      # journal entry and the second nothing; an exit code of 0 alone passes in both wrong cases.
      - name: Migrate an empty database, then once more
        run: |
          first=$(npm run --silent db:migrate)
          echo "$first"
          expected=$(node -e 'const j = require("./drizzle/meta/_journal.json"); for (const e of j.entries) console.log(`applied ${e.tag}`)')
          if [ "$(echo "$first" | grep '^applied ' )" != "$expected" ]; then
            echo "::error::The first db:migrate must apply every migration of the journal:"
            echo "$expected"
            exit 1
          fi
          second=$(npm run --silent db:migrate)
          echo "$second"
          if [ "$(echo "$second" | tail -n 1)" != "nothing to apply" ]; then
            echo "::error::The second db:migrate must apply nothing."
            exit 1
          fi

      - name: Unit and database tests
        run: npm test

      - name: The schema files and the migrations agree
        run: |
          npx drizzle-kit generate
          changed=$(git status --porcelain -- drizzle src/server/db)
          if [ -n "$changed" ]; then
            echo "::error::drizzle-kit generate wrote a migration: the schema files and drizzle/ disagree."
            echo "$changed"
            exit 1
          fi

      # Only an added .sql file passes: a modified, deleted or renamed one fails.
      # On a pull request the base is where it left main; on main, the commit before the push.
      - name: No merged migration is edited
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            if ! base=$(git merge-base origin/main HEAD); then
              echo "::error::No merge base with origin/main was found, so the migrations cannot be compared."
              exit 1
            fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "A new branch: nothing to compare with."
            exit 0
          else
            base="$BEFORE"
          fi
          echo "Comparing with $base"
          edited=$(git diff --name-status --diff-filter=a "$base" HEAD -- 'drizzle/*.sql')
          if [ -n "$edited" ]; then
            echo "::error::A merged migration was modified, deleted or renamed. Write a new migration instead."
            echo "$edited"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Migrate
        run: npm run db:migrate

      # The browser of the Playwright version in package-lock.json; the headless shell is enough.
      - name: Install the browser
        run: npx playwright install --with-deps chromium --only-shell

      - name: Playwright
        run: npm run test:e2e

      # Build-plan 0.16: the image App Platform runs. It is built here as App Platform builds it,
      # migrates a fresh database before the app starts, and answers on /health with this commit.
      - name: Build the image
        run: docker build --tag procurement-app:ci .

      - name: Start the image against a fresh database and call the health route
        env:
          IMAGE_DATABASE_URL: postgres://procurement@127.0.0.1:5433/procurement_image
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker compose exec -T postgres createdb --username=procurement procurement_image
          docker run --detach --name app --network host \
            --env DATABASE_URL="$IMAGE_DATABASE_URL" --env GIT_COMMIT="$COMMIT" --env PORT=8080 \
            procurement-app:ci
          code=000
          for attempt in $(seq 1 60); do
            code=$(curl --silent --output health.json --write-out '%{http_code}' http://127.0.0.1:8080/health || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs app
          if [ "$code" != 200 ]; then
            echo "::error::/health did not answer 200 within 60 seconds (last answer: $code)."
            exit 1
          fi
          cat health.json; echo
          node -e '
            const body = require("./health.json");
            const fail = (m) => { console.log(`::error::${m}`); process.exit(1); };
            if (body.status !== "ok") fail(`/health status is ${body.status}`);
            if (body.commit !== process.env.COMMIT) fail(`/health names commit ${body.commit}, not ${process.env.COMMIT}`);
            if (body.timezone !== "UTC") fail(`the database session speaks ${body.timezone}, not UTC`);
          '
          # The migrations ran in the container before the app started: one line per journal entry.
          expected=$(node -e 'const j = require("./drizzle/meta/_journal.json"); for (const e of j.entries) console.log(`applied ${e.tag}`)')
          if [ "$(docker logs app 2>&1 | grep '^applied ')" != "$expected" ]; then
            echo "::error::The container did not apply every migration of the journal before it started."
            exit 1
          fi
          if ! curl --silent --fail http://127.0.0.1:8080/login | grep --quiet "${COMMIT:0:7}"; then
            echo "::error::The sign-in page does not show the commit ${COMMIT:0:7}."
            exit 1
          fi

      # A failed migration ends the container, so a broken version never answers.
      - name: The image does not start when its migration fails
        run: |
          docker run --detach --name app-broken --network host \
            --env DATABASE_URL=postgres://procurement@127.0.0.1:5433/procurement_missing --env PORT=8081 \
            procurement-app:ci
          status=$(timeout 120 docker wait app-broken || true)
          docker logs app-broken
          if [ -z "$status" ] || [ "$status" = 0 ]; then
            echo "::error::The container did not end with an error within 120 seconds although its migration failed (status: '$status')."
            exit 1
          fi
          if ! docker logs app-broken 2>&1 | grep --quiet '^db:migrate failed: '; then
            echo "::error::The container did not stop at the migration."
            exit 1
          fi
          if curl --silent --fail http://127.0.0.1:8081/health; then
            echo "::error::/health answered although the migration failed."
            exit 1
          fi

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
