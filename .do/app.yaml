# The live app on DigitalOcean App Platform (build-plan 9.4; 18-hosting-and-costs.md rows 1 to 3;
# D52: no test copy, the live app runs in trial mode with invented data until 9.5). docs/deploy.md
# says how the owner creates the app from this file. No value here is a secret: the database
# address and its certificate are bound by DigitalOcean itself (`${db.…}`), so nobody types them
# and no file holds them. The values the owner types (BETTER_AUTH_SECRET, three S3_*, two
# BACKUP_S3_*, four SEED_*_PASSWORD, ERROR_REPORT_DSN) are not declared here: docs/deploy.md lists
# them, and says to type them again after this file is applied.
#
# Checked on 20.10.2026 against DigitalOcean's documentation and the live app (D59): the size slug
# ($10), the fields of a managed database, and the bindings CA_CERT and COMMIT_HASH. The database
# component is named `ombor-db`, as the dashboard named it when the app was created: App Platform
# refuses a spec that renames it ("cannot create and delete a database in a single spec change").
name: ombor
region: fra

domains:
  - domain: ombor.sodiqschool.uz
    type: PRIMARY

services:
  - name: web
    # A new version on every push to main, through DigitalOcean's own GitHub app
    # (Decided ahead 0.16, item 3; open question 10: every merge reaches the one live app).
    github:
      repo: sodiqschoolapp/procurement
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    # 1 GiB, shared CPU, the fixed kind: $10 a month (row 1). One container.
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    # Traffic moves to a new version only after /health answers 200, which needs the migration
    # to have run (scripts/start.sh) and the database to answer within 3 seconds.
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # Straight to the database, never through a connection pool, so the app's
      # `-c timezone=UTC -c jit=off` reach the server (plan of 9.4, decided item 9).
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${ombor-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${ombor-db.CA_CERT}
      - key: GIT_COMMIT
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      # Trial mode (D52): the demo users and the invented data of the seed on every start
      # (scripts/start.sh). Task 9.5 removes it before `npm run trial:reset`; after the reset the
      # seed refuses whatever this says. The four SEED_*_PASSWORD values are typed by the owner,
      # encrypted, in the dashboard (docs/deploy.md), never here. The error reports' environment
      # tag reads it too (`trial` while it is set; docs/monitoring.md).
      - key: SEED_DEMO_DATA
        scope: RUN_TIME
        value: "yes"
      # The file storage: the private Cloudflare R2 bucket of the photos and receipts. S3_ENDPOINT,
      # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY are typed by the owner, encrypted, in the
      # dashboard (docs/deploy.md), never here.
      - key: S3_REGION
        scope: RUN_TIME
        value: auto
      - key: S3_BUCKET
        scope: RUN_TIME
        value: ombor-files
      # The bucket of the weekly copies of the database, of its own (build-plan 8.2b). Its keys,
      # BACKUP_S3_ACCESS_KEY_ID and BACKUP_S3_SECRET_ACCESS_KEY, are typed by the owner, encrypted,
      # in the dashboard (docs/deploy.md), never here.
      - key: BACKUP_S3_BUCKET
        scope: RUN_TIME
        value: ombor-copies

databases:
  # The managed PostgreSQL cluster `ombor-db` the owner creates first (docs/deploy.md, step 3):
  # PostgreSQL 17, one node of 1 GiB in Frankfurt, $15 a month (row 2), with DigitalOcean's daily
  # backups and restore to any moment of the last 7 days (13-technology.md, Running it). The app
  # connects as the cluster's admin user to its first database: `npm run trial:reset` drops and
  # makes again the `public` schema, which only the database's owner may do (plan of 9.4, decided
  # item 1, Look first).
  - name: ombor-db
    engine: PG
    version: "17"
    production: true
    cluster_name: ombor-db
    db_name: defaultdb
    db_user: doadmin
